#===================================

name: kawahputih

services:
  # --------------------------------------------------------------------------
  # Database
  # --------------------------------------------------------------------------
  mysql:
    # 8.4 = versi LTS. Volume dari MySQL 8.4 tidak bisa dibuka oleh 8.0.
    image: mysql:8.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-kawah_putih_db}
      MYSQL_USER: ${DB_USER:-kawahputih}
      MYSQL_PASSWORD: ${DB_PASSWORD:-kawahputih_secret}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    # Buka hanya bila perlu mengakses MySQL dari komputer host
    # (mis. MySQL Workbench / DBeaver). Bisa bentrok dengan MySQL lokal.
    # ports:
    #   - "${MYSQL_HOST_PORT:-3306}:3306"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --------------------------------------------------------------------------
  # API backend (Go)
  # --------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_PORT: "1022"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080,http://127.0.0.1:8080}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8080}

      # Koneksi database — host "mysql" adalah nama service di atas.
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-kawahputih}
      DB_PASSWORD: ${DB_PASSWORD:-kawahputih_secret}
      DB_NAME: ${DB_NAME:-kawah_putih_db}
      DB_TLS: "false"
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-50}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-10}

      REDIS_ADDR: redis:6379
      REDIS_DB: ${REDIS_DB:-0}

      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      JWT_ISSUER: ${JWT_ISSUER:-KawahPutih}

      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}

      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@kawahputih.id}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://localhost:8080/api/v1/auth/google/callback}

      SEED_SUPERADMIN_PASSWORD: ${SEED_SUPERADMIN_PASSWORD:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_MANAGER_PASSWORD: ${SEED_MANAGER_PASSWORD:-}
      SEED_PETUGAS_PASSWORD: ${SEED_PETUGAS_PASSWORD:-}
      SEED_RESET_STAFF_PASSWORD: ${SEED_RESET_STAFF_PASSWORD:-false}

      UPLOAD_DIR: /app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:1022/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # --------------------------------------------------------------------------
  # Web frontend (Next.js)
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
      args:
        # URL absolut yang dipanggil browser. Default cocok untuk akses dari
        # komputer ini. Saat deploy ke server/domain, ubah lewat .env, mis.
        # NEXT_PUBLIC_API_BASE_URL=https://api.kawahputih.id/api/v1
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:1031/api/v1}
    restart: unless-stopped
    environment:
      # Dipakai route handler proxy /api/v1 dan /uploads di sisi server Next.
      # Nilai ini dibaca saat request, bukan saat build.
      BACKEND_ORIGIN: http://backend:1031
      PORT: "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --------------------------------------------------------------------------
  # Gateway: satu-satunya pintu masuk dari browser (port 8080).
  # Backend, frontend, MySQL, dan Redis tidak diekspos langsung ke host.
  # --------------------------------------------------------------------------
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
    image: kawahputih-gateway
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      # Default hanya localhost. Untuk akses dari HP di jaringan yang sama,
      # set BIND_HOST=0.0.0.0 di file .env.
      - "${BIND_HOST:-127.0.0.1}:${APP_PORT:-8081}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  mysql-data:
  uploads:
