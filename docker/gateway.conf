# Gateway Nginx untuk docker-compose.yml.
# Browser hanya membuka satu port (8080 di host) dan gateway ini yang
# meneruskan request ke frontend/backend berdasarkan path.

# Teruskan skema asli (http/https) dari reverse proxy host bila ada.
map $http_x_forwarded_proto $client_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    # Batas unggah bukti pembayaran/foto.
    client_max_body_size 25m;

    # Docker DNS internal. Dipakai karena nama service di-resolve ulang.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/v1/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $client_proto;
        proxy_read_timeout 120s;
    }

    location = /healthz {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_proto;
        proxy_read_timeout 120s;
        # Dukung streaming response dari Next.js.
        proxy_buffering off;
    }
}
